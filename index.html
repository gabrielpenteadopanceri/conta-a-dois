<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Conta a Dois</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#F3F3F0" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0E0E0F" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Conta a Dois">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">

<style>
@font-face{font-family:'Outfit';src:url('fonts/outfit.woff2') format('woff2');font-weight:100 900;font-display:swap}
@font-face{font-family:'Plus Jakarta Sans';src:url('fonts/plus-jakarta-sans.woff2') format('woff2');font-weight:200 800;font-display:swap}

:root{
  /* layout: white rail on tablet, bottom bar on phone; white cards on a faintly tinted page; the accent is the color of whoever is using the app (red or pink) */
  --bg:#F3F3F0; --surface:#FFFFFF; --soft:#EEEEEA; --ink:#18181A; --muted:#66665F; --line:#E7E7E2;
  --on-accent:#FFFFFF;
  --pa:#CF1B33; --pb:#D23C8B; --pb-fill:#F28DBD;
  --good:#1D8650; --warn:#946600; --crit:#C2410C;
  --shadow:0 1px 2px rgba(24,24,26,.05),0 12px 32px rgba(24,24,26,.06);
  --font-d:'Outfit','Trebuchet MS',system-ui,sans-serif;
  --font-b:'Plus Jakarta Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --r:22px;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E0E0F; --surface:#1A1A1C; --soft:#252528; --ink:#F4F4F1; --muted:#A3A39D; --line:#2F2F33;
    --on-accent:#1F1719;
    --pa:#FF6B78; --pb:#FF9CCB; --pb-fill:#FF9CCB;
    --good:#5CC48A; --warn:#E3B341; --crit:#FF9B5E;
    --shadow:0 1px 2px rgba(0,0,0,.4);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E0E0F; --surface:#1A1A1C; --soft:#252528; --ink:#F4F4F1; --muted:#A3A39D; --line:#2F2F33;
  --on-accent:#1F1719;
  --pa:#FF6B78; --pb:#FF9CCB; --pb-fill:#FF9CCB;
  --good:#5CC48A; --warn:#E3B341; --crit:#FF9B5E;
  --shadow:0 1px 2px rgba(0,0,0,.4);
  color-scheme:dark;
}
body{--accent:var(--pa);--accent-soft:color-mix(in srgb,var(--accent) 11%,var(--surface))}
body[data-me="b"]{--accent:var(--pb)}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:color-mix(in srgb,var(--accent) 5%,var(--bg));color:var(--ink);font:400 16px/1.5 var(--font-b);font-variant-numeric:tabular-nums}
h1,h2,h3{font-family:var(--font-d);margin:0;text-wrap:balance}
h1{font-size:2rem;font-weight:600}
h2{font-size:1.2rem;font-weight:600}
h3{font-size:1.05rem;font-weight:600}
p{margin:0}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
svg.ic{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}

.app{display:grid;grid-template-columns:248px minmax(0,1fr);min-height:100vh}
.rail{background:var(--surface);padding:26px 16px;display:flex;flex-direction:column;gap:26px;position:sticky;top:0;height:100vh}
.brand{font:600 1.4rem var(--font-d);padding:0 10px;display:flex;align-items:center;gap:10px}
.brand i{display:inline-flex;width:30px;height:18px;border-radius:9px;overflow:hidden;flex:none;gap:2px}
.brand i::before,.brand i::after{content:"";flex:1}
.brand i::before{background:var(--pa)} .brand i::after{background:var(--pb-fill)}
.who{display:flex;flex-direction:column;gap:8px;padding:0 6px}
.who small,.label{font-size:.85rem;color:var(--muted);font-weight:500}
nav.links{display:flex;flex-direction:column;gap:4px}
.nav-btn{display:flex;align-items:center;gap:14px;padding:13px 14px;border:0;background:none;border-radius:16px;cursor:pointer;text-align:left;font-weight:600;color:var(--muted)}
.nav-btn:hover{color:var(--ink)}
.nav-btn[aria-current="page"]{background:var(--accent-soft);color:var(--accent)}
.nav-btn span{overflow:hidden;text-overflow:ellipsis}
.badge{background:var(--crit);color:var(--surface);border-radius:999px;font-size:.72rem;font-weight:700;padding:1px 8px;margin-left:auto;font-style:normal}
.tabbar{display:none}
main{padding:34px clamp(16px,4vw,48px) 64px;display:flex;flex-direction:column;gap:22px;min-width:0;max-width:1180px;width:100%}
.head{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px}
.month{display:flex;align-items:center;gap:2px;background:var(--surface);border-radius:999px;padding:4px;box-shadow:var(--shadow)}
.month b{min-width:150px;text-align:center;font-weight:600}
.month .icon-btn{color:var(--accent)}
.month b::first-letter{text-transform:uppercase}
.icon-btn{border:0;background:none;width:40px;height:40px;border-radius:50%;cursor:pointer;display:grid;place-items:center;color:var(--muted);flex:none}
.icon-btn:hover{background:var(--accent-soft);color:var(--accent)}
.icon-btn svg{width:18px;height:18px}

.btn{border:0;background:var(--soft);border-radius:999px;padding:11px 20px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:8px;min-height:46px}
.btn:hover{filter:brightness(.96)}
.btn.primary{background:var(--accent);color:var(--on-accent)}
.btn.primary:hover{filter:none;opacity:.86}
.btn.danger{background:var(--crit);color:var(--surface)}
.btn.ghost{background:none}
.btn.ghost:hover{background:var(--soft);filter:none}
.btn.del{color:var(--crit);padding-left:0}
.btn.light{background:var(--accent);color:var(--on-accent)}
.btn.small{min-height:38px;padding:7px 16px;font-size:.92rem}

.card{background:var(--surface);border-radius:var(--r);padding:22px;display:flex;flex-direction:column;gap:16px;min-width:0;box-shadow:var(--shadow)}
.grid{display:grid;gap:18px}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.tile{gap:6px}
.tile .num{font:600 1.7rem var(--font-d)}

.hero{background:var(--surface);border-radius:28px;padding:28px;display:flex;flex-direction:column;gap:14px;box-shadow:var(--shadow)}
.hero-label{color:var(--accent);font-weight:600}
.hero-label::first-letter{text-transform:uppercase}
.hero-num{font:600 clamp(2.4rem,6vw,3.4rem)/1.05 var(--font-d);letter-spacing:-.01em}
.hero .split{height:10px;border-radius:5px}
.hero-legend{display:flex;flex-wrap:wrap;gap:8px 24px;color:var(--muted)}
.hero-legend b{color:var(--ink);font-weight:600}
.hero-foot{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;background:var(--accent-soft);border-radius:18px;padding:14px 18px;font-weight:600;margin-top:4px}
.quick{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.q{border:0;background:var(--surface);border-radius:20px;padding:16px 10px;display:flex;flex-direction:column;align-items:center;gap:10px;cursor:pointer;font-weight:600;font-size:.92rem;text-align:center;box-shadow:var(--shadow)}
.q:hover .q-ic{background:var(--accent);color:var(--on-accent)}
.q-ic{width:46px;height:46px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center}
.tabs{display:inline-flex;background:var(--soft);border-radius:999px;padding:4px;gap:2px;align-self:flex-start;max-width:100%;overflow-x:auto}
.tab{border:0;background:none;border-radius:999px;padding:9px 20px;font-weight:600;color:var(--muted);cursor:pointer;white-space:nowrap;min-height:42px}
.tab[aria-selected="true"]{background:var(--surface);color:var(--accent);box-shadow:0 1px 3px rgba(24,24,26,.12)}

.balance{flex-direction:row;flex-wrap:wrap;align-items:center;justify-content:space-between}
.balance .big{font:600 1.7rem/1.2 var(--font-d)}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:8px}
.dot.a{background:var(--pa)} .dot.b{background:var(--pb-fill)}
.pa{color:var(--pa)} .pb{color:var(--pb)}

.bars{display:flex;align-items:flex-end;gap:12px;height:250px;padding-top:6px}
.bars .col{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:6px;min-width:0;height:100%}
.bars .stack{width:min(100%,40px);display:flex;flex-direction:column;gap:3px}
.bars .stack span{display:block;border-radius:6px}
.bars .sa{background:var(--pa)} .bars .sb{background:var(--pb-fill)}
.bars small{font-size:.75rem;color:var(--muted);white-space:nowrap}
.bar-labels{display:flex;gap:12px}
.bar-labels span{flex:1;text-align:center;font-size:.82rem;color:var(--muted);text-transform:capitalize}
.legend{display:flex;flex-wrap:wrap;gap:18px;font-size:.9rem;color:var(--muted)}

.cat-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 12px;align-items:baseline}
.track{grid-column:1/-1;height:8px;background:var(--soft);border-radius:4px;overflow:hidden}
.track i{display:block;height:100%;background:var(--muted);border-radius:4px}
.track i.warn{background:var(--warn)} .track i.crit{background:var(--crit)} .track i.good{background:var(--good)}
.sub{font-size:.88rem;color:var(--muted)}

.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:4px 12px;font-size:.8rem;font-weight:600;background:var(--soft);color:var(--muted);white-space:nowrap}
.pill.ok{color:var(--good)} .pill.warn{color:var(--warn)} .pill.crit{color:var(--crit)}
.chip{border:0;background:var(--surface);border-radius:999px;padding:9px 18px;cursor:pointer;font-weight:600;font-size:.92rem;min-height:42px;color:var(--muted);box-shadow:var(--shadow)}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--on-accent)}
.chips{display:flex;flex-wrap:wrap;gap:8px}

.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.toolbar input[type=search],.toolbar input.grow{flex:1 1 200px}
input[type=text],input[type=search],input[type=date],input[type=number],select{background:var(--soft);border:0;border-radius:14px;padding:12px 14px;min-height:48px;width:100%}
input[type=file]{font-size:.92rem;max-width:100%}
main>.toolbar input,main>.toolbar select{background:var(--surface);box-shadow:var(--shadow)}
.toolbar select,.toolbar input.narrow{width:auto;flex:0 1 170px}
.list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.day{font-size:.82rem;color:var(--muted);font-weight:600;padding:16px 0 4px}
.day::first-letter{text-transform:uppercase}
.row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:14px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.row.x{grid-template-columns:46px minmax(0,1fr) auto auto}
.row:last-child{border-bottom:0}
.row.tap{cursor:pointer;border-radius:14px}
.row.tap:hover strong{text-decoration:underline}
.row>div{display:flex;flex-direction:column;gap:2px;min-width:0}
.row>div .pill{align-self:flex-start;margin-top:4px}
.row strong{font-weight:600;overflow-wrap:anywhere}
.row .amt{font-weight:700;white-space:nowrap}
.amt-col{align-items:flex-end}
.amt-col .split{width:52px}
.cat-ic{width:46px;height:46px;border-radius:50%;background:var(--accent-soft);display:grid;place-items:center;color:var(--accent)}
.cat-ic svg{width:21px;height:21px}
.split{height:6px;border-radius:3px;overflow:hidden;display:flex;gap:2px;background:var(--surface)}
.split i{background:var(--pa)} .split b{background:var(--pb-fill);flex:1}
.acts{display:flex;align-items:center}
.empty{color:var(--muted);padding:18px 0;text-align:center}
.item{display:grid;grid-template-columns:auto minmax(0,1fr) auto auto;gap:14px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:0}
.item input[type=checkbox]{width:24px;height:24px;accent-color:var(--accent)}
.item.done label{text-decoration:line-through;color:var(--muted)}
.item label{overflow-wrap:anywhere;cursor:pointer;font-weight:500}

.docs{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:16px}
.doc{padding:0;overflow:hidden;gap:0;cursor:pointer;text-align:left;font:inherit;color:inherit;border:0}
.doc:hover{transform:translateY(-2px)}
.thumb{height:120px;background:var(--soft);display:grid;place-items:center;color:var(--muted);font:600 .95rem var(--font-d);letter-spacing:.06em}
.thumb img{width:100%;height:120px;object-fit:cover;display:block}
.doc .info{padding:14px 16px 16px;display:flex;flex-direction:column;gap:6px;align-items:flex-start}
.doc .info strong{overflow-wrap:anywhere}

.banner{background:var(--soft);border-radius:18px;padding:12px 18px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;font-size:.92rem}
.banner .btn{background:var(--surface)}
.prog{height:8px;background:var(--soft);border-radius:4px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--good);border-radius:4px}
.sav .num{font:600 1.6rem var(--font-d)}
.sav>.head{flex-wrap:nowrap;align-items:flex-start}
.sav>.head h3{min-width:0;overflow-wrap:anywhere}
.kv{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px 16px;align-items:baseline}
.kv b{text-align:right;font-weight:700;white-space:nowrap}
.kv .sep{grid-column:1/-1;border-top:1px solid var(--line)}

dialog{border:0;border-radius:26px;background:var(--surface);color:var(--ink);padding:0;width:min(540px,calc(100vw - 24px));max-height:calc(100vh - 24px);box-shadow:0 24px 80px rgba(0,0,0,.3)}
dialog::backdrop{background:rgba(14,14,15,.5)}
dialog form{padding:26px;display:flex;flex-direction:column;gap:18px}
.dlg-body{display:flex;flex-direction:column;gap:16px}
.field{display:flex;flex-direction:column;gap:6px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.seg{display:flex;background:var(--soft);border-radius:14px;padding:4px;gap:2px}
.seg label{flex:1;position:relative;cursor:pointer}
.seg input{position:absolute;opacity:0;inset:0}
.seg span{display:flex;align-items:center;justify-content:center;text-align:center;padding:9px 8px;font-weight:600;min-height:42px;border-radius:11px;color:var(--muted)}
.seg input:checked+span{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(24,24,26,.12)}
.seg input:focus-visible+span{outline:2px solid var(--accent);outline-offset:-2px}
#who-seg input:checked+span{background:var(--accent);color:var(--on-accent)}
#who-seg input:checked+span .dot{background:var(--on-accent)}
input[type=range]{width:100%;accent-color:var(--accent)}
.dlg-actions{display:flex;justify-content:flex-end;gap:10px;flex-wrap:wrap}
.err{color:var(--crit);font-weight:600}
.viewer img{max-width:100%;border-radius:14px;display:block}
#toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:var(--ink);color:var(--surface);padding:12px 20px;border-radius:999px;font-weight:600;opacity:0;pointer-events:none;transition:opacity .2s;max-width:calc(100vw - 32px);z-index:5}
#toast.on{opacity:1}
@media (prefers-reduced-motion: reduce){#toast{transition:none}.doc:hover{transform:none}}

@media (max-width:1100px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:860px){
  .app{grid-template-columns:minmax(0,1fr)}
  .rail{position:static;height:auto;flex-direction:row;align-items:center;justify-content:space-between;padding:14px 16px;background:none}
  .rail nav.links{display:none}
  .who{flex-direction:row;align-items:center;padding:0}
  .who small{display:none}
  .tabbar{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));position:fixed;left:0;right:0;bottom:0;background:var(--surface);z-index:4;box-shadow:0 -1px 0 var(--line);padding-bottom:4px}
  .tabbar .nav-btn{flex-direction:column;gap:3px;font-size:.72rem;padding:10px 1px 6px;border-radius:0;justify-content:center;text-align:center;min-width:0;position:relative}
  .tabbar .nav-btn span{max-width:100%;white-space:nowrap}
  .tabbar .nav-btn[aria-current="page"]{background:none;color:var(--accent)}
  .tabbar .badge{position:absolute;top:4px;left:50%;margin:0 0 0 6px}
  main{padding-top:8px;padding-bottom:104px}
  .g3,.g2{grid-template-columns:minmax(0,1fr)}
  h1{font-size:1.7rem}
}
@media (max-width:520px){
  .g4{grid-template-columns:minmax(0,1fr)}
  .quick{grid-template-columns:repeat(2,minmax(0,1fr))}
  .row.x{grid-template-columns:42px minmax(0,1fr) auto auto;gap:10px}
  .cat-ic{width:42px;height:42px}
  .two{grid-template-columns:1fr}
  .month b{min-width:118px}
  .brand{font-size:1.15rem}
  .hero{padding:22px;border-radius:24px}
  .card{padding:18px}
}

/* botão fixo de nova despesa */
.fab{position:fixed;right:28px;bottom:28px;width:62px;height:62px;border-radius:50%;border:0;background:var(--accent);color:var(--on-accent);box-shadow:0 10px 28px rgba(24,24,26,.22);cursor:pointer;display:grid;place-items:center;z-index:3}
.fab svg{width:28px;height:28px;stroke-width:2.2}
.back{align-self:flex-start;margin-bottom:-12px;padding-left:8px}
.back svg{width:16px;height:16px}
.more{flex-direction:row;align-items:center;gap:16px;border:0;cursor:pointer;text-align:left;font:inherit;color:inherit}
.more strong{display:block}
.who-head{display:flex;align-items:center;justify-content:space-between;min-height:32px}
.who-head .icon-btn{width:32px;height:32px}
#who-seg span{white-space:nowrap}
.fl{width:17px;height:17px;margin-right:6px;color:var(--pb-fill);flex:none}
#who-seg input:checked+span .fl{color:var(--on-accent)}
/* tela de entrada */
.lock{display:flex;flex-direction:column;align-items:center;gap:26px;padding-top:8vh;text-align:center}
.lock .grid{width:min(560px,100%)}
.who-card{align-items:center;gap:10px;border:0;cursor:pointer;font:inherit;color:inherit;padding:30px 18px}
.who-card strong{font:600 1.3rem var(--font-d)}
.who-card .q-ic{width:72px;height:72px}
.who-card .q-ic svg{width:34px;height:34px;margin:0}
.who-card.a .q-ic{background:color-mix(in srgb,var(--pa) 11%,var(--surface));color:var(--pa)}
.who-card.b .q-ic{background:color-mix(in srgb,var(--pb-fill) 22%,var(--surface));color:var(--pb-fill)}
body.locked .who,body.locked .links,body.locked .tabbar,body.locked .fab{display:none}
body.locked .app{grid-template-columns:minmax(0,1fr)}
body.locked .rail{display:none}
/* perfil rosa: flores */
.hero{position:relative;overflow:hidden}
.hero>*{position:relative}
.hero-deco{position:absolute!important;right:-4px;top:-12px;width:min(200px,34%);pointer-events:none}
.hero-deco svg{display:block;width:100%;height:auto}
body[data-me="b"]{background-image:var(--petals);background-size:340px 340px}
body[data-me="b"] .hero{background:linear-gradient(115deg,var(--surface) 48%,color-mix(in srgb,var(--pb-fill) 24%,var(--surface)))}
body[data-me="b"] .card,body[data-me="b"] .hero{border-radius:28px}
@media (max-width:860px){.fab{right:18px;bottom:92px}}
@media (max-width:860px){.who-head{order:2}}
@media (max-width:520px){.hero-deco{width:32%;opacity:.7}}
</style>
</head>
<body>
<div class="app">
  <aside class="rail">
    <div class="brand"><i></i>Conta a Dois</div>
    <div class="who"><div class="who-head"><small>Usando como</small><button class="icon-btn" id="lock-btn" data-act="lock" aria-label="Bloquear o app" title="Bloquear" hidden><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg></button></div><div class="seg" id="who-seg"></div></div>
    <nav class="links" id="rail-nav" aria-label="Seções"></nav>
  </aside>
  <main id="main"></main>
</div>
<nav class="tabbar" id="tabbar" aria-label="Seções"></nav>
<button class="fab" data-act="fab" aria-label="Nova despesa" title="Nova despesa"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button>
<dialog id="dlg"></dialog>
<div id="toast" role="status"></div>

<script>
/* ---------- utilitários ---------- */
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');

function addMonths(ym,n){let [y,m]=ym.split('-').map(Number);m+=n;while(m<1){m+=12;y--}while(m>12){m-=12;y++}return y+'-'+pad(m)}

function dayLabel(iso){const [y,m,d]=iso.split('-').map(Number);return new Date(y,m-1,d).toLocaleDateString('pt-BR',{weekday:'long',day:'numeric',month:'long'})}
function shortDate(iso){const [y,m,d]=iso.split('-');return d+'/'+m+'/'+y}
function daysUntil(iso){const [y,m,d]=iso.split('-').map(Number);const t=new Date();t.setHours(0,0,0,0);return Math.round((new Date(y,m-1,d)-t)/864e5)}
function parseMoney(t){
  t=String(t??'').trim().replace(/[R$\s]/g,'');
  if(!t) return NaN;
  if(t.includes(',')) t=t.replace(/\./g,'').replace(',','.');
  else if(/^\d{1,3}(\.\d{3})+$/.test(t)) t=t.replace(/\./g,'');
  const n=Number(t);
  return isFinite(n)&&n>0?Math.round(n*100):NaN;
}

/* ---------- regras de divisão e saldo ---------- */
// parte da despesa que cabe à pessoa pid, em centavos
function shareOf(e,pid){
  if(e.scope!=='casal') return e.scope===pid?e.amount:0;
  const a=Math.round(e.amount*e.shareA/100);
  return pid==='a'?a:e.amount-a;
}
// saldo acumulado: positivo = B deve para A; negativo = A deve para B
function balanceOf(expenses,settlements){
  let bal=0;
  for(const e of expenses){const owed=shareOf(e,other(e.payer));bal+=e.payer==='a'?owed:-owed}
  for(const s of settlements) bal+=s.from==='a'?s.amount:-s.amount;
  return bal;
}
// divide um total em n parcelas; os centavos que sobram vão na primeira
function installments(total,n){const base=Math.floor(total/n);return Array.from({length:n},(_,i)=>i===0?total-base*(n-1):base)}

let idbP=null;
function idb(){
  if(!idbP) idbP=new Promise((res,rej)=>{try{const r=indexedDB.open('contaadois',1);r.onupgradeneeded=()=>r.result.createObjectStore('files');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)}catch(e){rej(e)}});

}

function balText(bal){

  return {cls:deb,html:`<span class="p${deb}">${esc(N(deb))}</span> deve ${brl(Math.abs(bal))} a <span class="p${cred}">${esc(N(cred))}</span>`};

// lembretes de hoje: contas fixas do mês corrente, documentos e garantias perto do vencimento
function alerts(){
  const out=[],cur=curYM(),today=new Date().getDate(),dd=n=>n+(n===1?' dia':' dias');
  for(const b of S.bills){
    if(S.expenses.some(e=>e.billId===b.id&&e.ym===cur)) continue;
    const diff=b.dueDay-today;
    if(diff<0) out.push({k:'crit',title:b.name,sub:'Conta fixa · '+brl(b.amount),t:'Atrasada há '+dd(-diff),order:diff});
    else if(diff<=S.remindDays) out.push({k:'warn',title:b.name,sub:'Conta fixa · '+brl(b.amount),t:diff===0?'Vence hoje':'Vence em '+dd(diff),order:diff});
  }
  for(const d of S.docs){if(!d.expiry) continue;const n=daysUntil(d.expiry);
    if(n<=30) out.push({k:n<0?'crit':'warn',title:d.name,sub:'Documento · '+d.folder,t:n<0?'Venceu em '+shortDate(d.expiry):n===0?'Vence hoje':'Vence em '+dd(n),order:n})}
  for(const i of S.inventory){if(!i.warranty) continue;const n=daysUntil(i.warranty);
    if(n>=0&&n<=30) out.push({k:'warn',title:i.name,sub:'Garantia · '+i.room,t:n===0?'Garantia acaba hoje':'Garantia acaba em '+dd(n),order:n})}
  return out.sort((x,y)=>x.order-y.order);
}

  if(ui.scope==='minhas') list=list.filter(e=>e.scope===S.me);

  if(q) list=list.filter(e=>(e.desc+' '+e.cat).toLowerCase().includes(q));
  const sets=(ui.scope==='todas'&&!ui.cat&&!q)?S.settlements.filter(s=>s.date.slice(0,7)===ui.ym).map(s=>({...s,settle:true})):[];

function billState(b){
  const paid=S.expenses.find(e=>e.billId===b.id&&e.ym===ui.ym);
  if(paid) return {paid,k:'ok',t:'Paga por '+N(paid.payer)};
  const cur=curYM();
  if(ui.ym<cur) return {k:'crit',t:'Não paga'};
  if(ui.ym>cur) return {k:'',t:'Vence dia '+b.dueDay};
  const diff=b.dueDay-new Date().getDate();
  if(diff<0) return {k:'crit',t:'Atrasada há '+(-diff)+(diff===-1?' dia':' dias')};
  if(diff===0) return {k:'warn',t:'Vence hoje'};
  if(diff<=5) return {k:'warn',t:'Vence em '+diff+(diff===1?' dia':' dias')};
  return {k:'',t:'Vence dia '+b.dueDay};
}

async function loadThumbs(){
  for(const el of document.querySelectorAll('[data-thumb]')){
    try{const blob=await fileGet(el.dataset.thumb);if(!blob||!el.isConnected) continue;const u=URL.createObjectURL(blob);urls.push(u);const img=new Image();img.alt='';img.src=u;el.textContent='';el.appendChild(img)}catch(e){}
  }
}

      const n=Number(fd.get('inst'))||1,parts=installments(amount,n),group=n>1?uid():undefined;

  $('#dlg-form').addEventListener('input',upd);upd();
  const sc=$('#e-scan');

      const f=sc.files[0],l=$('#e-scan-l');if(!f) return;

        const total=r&&!r.erro?Math.round(Number(r.total)*100):0;
        if(!(total>0)){l.textContent='Não consegui ler essa foto. Tente outra mais nítida ou preencha à mão.';return}

      }
    });
  }

// O PIN é uma barreira de uso no aparelho, não criptografia: guarda-se só o resumo (hash) dele.
async function pinHash(salt,pin){
  try{const d=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(salt+':'+pin));return [...new Uint8Array(d)].map(b=>b.toString(16).padStart(2,'0')).join('')}
  catch(e){let x=5381;for(const c of salt+':'+pin) x=((x<<5)+x+c.charCodeAt(0))|0;return 'x'+x}
}
async function pinOk(p,pin){const r=S.pins[p];return !!r&&await pinHash(r.salt,pin)===r.hash}
const validPin=v=>/^\d{4,6}$/.test(v);
const pinField=(id,name,label)=>`<div class="field"><label class="label" for="${id}">${label}</label><input type="password" inputmode="numeric" autocomplete="off" id="${id}" name="${name}" maxlength="6"></div>`;
function enterAs(p){S.me=p;locked=false;ui.subI='geral'}
function askPin(p,then){
  openDlg('PIN de '+N(p),pinField('pin-in','pin','Digite o PIN para entrar')+`<div><button type="button" class="btn small ghost del" data-act="forgot-pin" data-p="${p}">Esqueci o PIN</button></div>`,
  'Entrar',async fd=>{if(!await pinOk(p,String(fd.get('pin')))) return 'PIN incorreto. Tente de novo.';then();return null});
  setTimeout(()=>{const i=$('#pin-in');if(i) i.focus()},60);
}
function switchTo(p){if(S.pins[p]) askPin(p,()=>enterAs(p));else{enterAs(p);save();render()}}
function setPinDialog(){
  const me=S.me,has=!!S.pins[me];
  openDlg(has?'Trocar PIN':'Criar PIN',(has?pinField('pin-cur','cur','PIN atual'):'')+pinField('pin-new','pin','Novo PIN, de 4 a 6 números')+pinField('pin-rep','rep','Repita o novo PIN'),
  'Salvar PIN',async fd=>{
    if(has&&!await pinOk(me,String(fd.get('cur')))) return 'O PIN atual não confere.';
    const pin=String(fd.get('pin'));
    if(!validPin(pin)) return 'Use de 4 a 6 números.';
    if(pin!==String(fd.get('rep'))) return 'Os dois PINs digitados são diferentes.';
    const salt=uid();S.pins[me]={salt,hash:await pinHash(salt,pin)};return null});
}
function removePinDialog(){
  const me=S.me;
  openDlg('Remover PIN',pinField('pin-cur','cur','Digite o PIN atual para remover'),'Remover PIN',async fd=>{if(!await pinOk(me,String(fd.get('cur')))) return 'O PIN não confere.';S.pins[me]=null;return null},true);
}
function forgotPin(p){
  const o=other(p);
  if(S.pins[o]) openDlg('Redefinir o PIN de '+N(p),`<p>Para remover o PIN de ${esc(N(p))}, ${esc(N(o))} precisa confirmar com o próprio PIN.</p>`+pinField('pin-oth','pin','PIN de '+esc(N(o))),'Remover PIN de '+N(p),
    async fd=>{if(!await pinOk(o,String(fd.get('pin')))) return 'O PIN de '+N(o)+' não confere.';S.pins[p]=null;locked=!!(S.pins.a||S.pins.b)&&locked;return null},true);
  else confirmDlg('Redefinir o PIN de '+N(p),N(o)+' não tem PIN para confirmar, então qualquer pessoa com o aparelho em mãos consegue fazer isto. Remover o PIN de '+N(p)+'?','Remover PIN',()=>{S.pins[p]=null});
}
function listDialog(){
  openDlg('Nova lista',`<div class="field"><label class="label" for="l-name">Nome da lista</label><input type="text" id="l-name" name="name" maxlength="40" placeholder="Ex.: farmácia"></div>`,
  'Criar lista',fd=>{const name=String(fd.get('name')).trim();if(!name) return 'Dê um nome para a lista.';const l={id:uid(),name,items:[]};S.lists.push(l);ui.list=l.id;return null});
}
async function addDoc(file,meta){
  if(file.size>20*1024*1024) return 'O arquivo passa de 20 MB. Escolha um menor.';
  const d={id:uid(),name:meta.name,folder:meta.folder,tags:meta.tags,date:todayISO(),expiry:meta.expiry,type:file.type||'',size:file.size,hasFile:true};
  try{await filePut(d.id,file)}catch(e){return 'Este navegador não deixou guardar o arquivo. Tente abrir o app fora do modo anônimo.'}
  S.docs.push(d);return d;
}
function docDialog(){
  openDlg('Adicionar documento',`<div class="field"><label class="label" for="dc-file">Arquivo (foto ou PDF, até 20 MB)</label><input type="file" id="dc-file" name="file" accept="image/*,application/pdf"></div>
    <div class="field"><label class="label" for="dc-name">Nome</label><input type="text" id="dc-name" name="name" maxlength="80" placeholder="Ex.: contrato de aluguel"></div>
    <div class="two"><div class="field"><label class="label" for="dc-folder">Pasta</label><select id="dc-folder" name="folder">${FOLDERS.map(f=>`<option ${f===ui.folder?'selected':''}>${esc(f)}</option>`).join('')}</select></div>
    <div class="field"><label class="label" for="dc-exp">Validade (opcional)</label><input type="date" id="dc-exp" name="expiry"></div></div>
    <div class="field"><label class="label" for="dc-tags">Etiquetas, separadas por vírgula</label><input type="text" id="dc-tags" name="tags" placeholder="garantia, cozinha"></div>`,
  'Guardar documento',async fd=>{const f=fd.get('file');if(!f||!f.size) return 'Escolha o arquivo do documento.';
    const name=String(fd.get('name')).trim()||f.name;const tags=String(fd.get('tags')).split(',').map(t=>t.trim().replace(/^#/,'')).filter(Boolean).slice(0,8);
    const r=await addDoc(f,{name,folder:fd.get('folder'),tags,expiry:fd.get('expiry')||''});return typeof r==='string'?r:null});
}
async function viewDoc(id){
  const d=S.docs.find(x=>x.id===id);if(!d){toast('Esse comprovante não está mais no cofre.');return}
  let body=`<p class="sub">${esc(d.folder)} · adicionado em ${shortDate(d.date)}${d.expiry?' · validade '+shortDate(d.expiry):''}${d.size?' · '+(d.size/1024/1024).toFixed(1).replace('.',',')+' MB':''}</p>`;
  if(!d.hasFile) body+='<p>Este é um documento de exemplo, sem arquivo.</p>';
  else if(d.type.startsWith('image/')){try{const blob=await fileGet(id);const u=URL.createObjectURL(blob);urls.push(u);body+=`<div class="viewer"><img src="${u}" alt="${esc(d.name)}"></div>`}catch(e){body+='<p>Não consegui abrir o arquivo neste navegador.</p>'}}
  else body+='<p>O arquivo está guardado. A abertura de PDF dentro do app entra na próxima etapa.</p>';
  body+=`<div><button type="button" class="btn small" data-act="del-doc" data-id="${d.id}">Excluir documento</button></div>`;
  openDlg(d.name,body,'',null);
}

let downloads=null;

// dentro do Claude o arquivo sai pela permissão de downloads; no app instalado, pelo download comum do navegador
async function saveFile(filename,data){
  if(downloads){await downloads.save({filename,data});return}
  const a=document.createElement('a'),u=URL.createObjectURL(new Blob([data]));
  a.href=u;a.download=filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),10000);
}
async function exportBackup(){
  try{await saveFile('conta-a-dois-backup-'+todayISO()+'.json',JSON.stringify(S));toast('Backup gerado. Guarde o arquivo em um lugar seguro.')}catch(e){toast('O backup foi cancelado ou bloqueado.')}
}
function restoreBackup(file){
  const r=new FileReader();
  r.onerror=()=>toast('Não consegui ler esse arquivo.');
  r.onload=()=>{
    let d;try{d=JSON.parse(r.result)}catch(e){d=null}
    const ok=d&&d.v===2&&d.names&&['expenses','settlements','bills','savings','docs','lists'].every(k=>Array.isArray(d[k]));
    if(!ok){toast('Esse arquivo não é um backup do Conta a Dois.');return}
    confirmDlg('Restaurar backup','Substituir todos os dados deste aparelho pelos do backup, com '+d.expenses.length+' despesas? Os dados atuais serão apagados.','Restaurar',()=>{
      if(!d.inventory) d.inventory=[];if(!d.remindDays) d.remindDays=5;if(!d.budgets) d.budgets={casal:{},a:{},b:{}};
      if(!d.theme) d.theme=S.theme||'claro';if(!d.pins) d.pins={a:null,b:null};
      S=d;
    });
  };
  r.readAsText(file);
}
async function exportCsv(){
  const q=v=>'"'+String(v).replace(/"/g,'""')+'"';
  const lines=[['Data','Descrição','Categoria','Valor','Pago por','De quem','Parte '+N('a'),'Parte '+N('b')].map(q).join(';')];
  S.expenses.filter(visible).sort((x,y)=>x.date<y.date?-1:1).forEach(e=>lines.push([shortDate(e.date),e.desc,e.cat,moneyInput(e.amount),N(e.payer),e.scope==='casal'?'Casal':N(e.scope),moneyInput(shareOf(e,'a'))||'0,00',moneyInput(shareOf(e,'b'))||'0,00'].map(q).join(';')));
  try{await saveFile('conta-a-dois-despesas.csv','﻿'+lines.join('\r\n'));toast('Planilha exportada.')}catch(e){toast('A exportação foi cancelada ou bloqueada.')}
}

const find=(k,id)=>S[k].find(x=>x.id===id);
function removeFrom(k,id){S[k]=S[k].filter(x=>x.id!==id)}
document.addEventListener('click',ev=>{
  const t=ev.target.closest('[data-act]');if(!t) return;
  const a=t.dataset.act,id=t.dataset.id;
  if(a==='close'){dlg.close();return}
  if(a==='go'){ui.view=t.dataset.v;try{location.hash=ui.view}catch(e){}render();window.scrollTo(0,0);return}
  if(a==='month'){ui.ym=addMonths(ui.ym,Number(t.dataset.n));render();return}
  if(a==='sub'){ui[t.dataset.k]=t.dataset.v;render();return}
  if(a==='fab') return expDialog(null,ui.view==='individual'?S.me:'casal');
  if(a==='lock'){locked=true;render();window.scrollTo(0,0);return}
  if(a==='unlock') return switchTo(t.dataset.p);
  if(a==='set-pin') return setPinDialog();
  if(a==='remove-pin') return removePinDialog();
  if(a==='forgot-pin') return forgotPin(t.dataset.p);
  if(a==='new-exp') return expDialog(null,t.dataset.scope);
  if(a==='edit-exp') return expDialog(find('expenses',id));
  if(a==='del-exp'){const e=find('expenses',id);return confirmDlg('Excluir despesa','Excluir "'+e.desc+'" de '+brl(e.amount)+'? O saldo entre vocês é recalculado.'+(e.group?' As outras parcelas continuam lançadas.':''),'Excluir',()=>removeFrom('expenses',id))}
  if(a==='settle') return settleDialog();
  if(a==='del-settle') return confirmDlg('Excluir acerto','Excluir este acerto? O saldo volta ao que era antes dele.','Excluir',()=>removeFrom('settlements',id));
  if(a==='new-bill') return billDialog();
  if(a==='edit-bill') return billDialog(find('bills',id));
  if(a==='del-bill'){const b=find('bills',id);return confirmDlg('Excluir conta fixa','Excluir "'+b.name+'"? Os pagamentos já lançados continuam nas despesas.','Excluir',()=>removeFrom('bills',id))}
  if(a==='pay') return payDialog(find('bills',id));
  if(a==='unpay'){S.expenses=S.expenses.filter(e=>!(e.billId===id&&e.ym===ui.ym));save();render();return}
  if(a==='budgets') return budgetsDialog(t.dataset.owner);
  if(a==='new-sav') return savDialog(null,t.dataset.owner);
  if(a==='edit-sav') return savDialog(find('savings',id));
  if(a==='move-sav') return moveDialog(find('savings',id));
  if(a==='del-sav'){const g=find('savings',id);return confirmDlg('Excluir reserva','Excluir "'+g.name+'" e o histórico de '+brl(savedOf(g))+' guardados?','Excluir',()=>removeFrom('savings',id))}
  if(a==='list'){ui.list=id;render();return}
  if(a==='new-list') return listDialog();
  if(a==='del-item'){const L=curList();L.items=L.items.filter(i=>i.id!==id);save();render();return}
  if(a==='clear-done'){const L=curList();L.items=L.items.filter(i=>!i.done);save();render();return}
  if(a==='del-list'){const L=curList();return confirmDlg('Excluir lista','Excluir a lista "'+L.name+'" com '+L.items.length+(L.items.length===1?' item?':' itens?'),'Excluir',()=>{removeFrom('lists',L.id);ui.list=''})}
  if(a==='folder'){ui.folder=t.dataset.f;render();return}
  if(a==='doctab'){ui.docTab=t.dataset.t;render();return}
  if(a==='new-inv') return invDialog();
  if(a==='edit-inv') return invDialog(find('inventory',id));
  if(a==='del-inv'){const i=find('inventory',id);return confirmDlg('Excluir item','Excluir "'+i.name+'" do inventário? A nota fiscal continua no cofre.','Excluir',()=>removeFrom('inventory',id))}
  if(a==='new-doc') return docDialog();
  if(a==='view-doc') return viewDoc(id);
  if(a==='del-doc'){const d=find('docs',id);return confirmDlg('Excluir documento','Excluir "'+d.name+'" do cofre? Não dá para desfazer.','Excluir',()=>{removeFrom('docs',id);S.expenses.forEach(e=>{if(e.docId===id) delete e.docId});S.inventory.forEach(i=>{if(i.docId===id) i.docId=''});fileDel(id)})}
  if(a==='csv') return exportCsv();
  if(a==='backup') return exportBackup();
  if(a==='clear-demo') return confirmDlg('Apagar exemplos','Apagar todos os itens de exemplo? O que vocês mesmos lançaram fica.','Apagar exemplos',()=>{['expenses','settlements','bills','savings','docs','inventory'].forEach(k=>S[k]=S[k].filter(x=>!x.demo));S.inventory.forEach(i=>{if(i.docId&&!S.docs.some(d=>d.id===i.docId)) i.docId=''});S.lists.forEach(l=>l.items=l.items.filter(i=>!i.demo));S.budgets={casal:{},a:{},b:{}}});
  if(a==='reset') return confirmDlg('Apagar tudo','Apagar todos os dados deste navegador, inclusive os documentos? Não dá para desfazer.','Apagar tudo',()=>{S.docs.forEach(d=>d.hasFile&&fileDel(d.id));const names=S.names,me=S.me,theme=S.theme;S=fresh(false);S.names=names;S.me=me;S.theme=theme});
});

document.addEventListener('submit',ev=>{

document.addEventListener('input',ev=>{
  const el=ev.target;
  if(el.id==='f-q'){ui.q=el.value;$('#exp-list').innerHTML=expRows()}
  if(el.id==='d-q'){ui.dq=el.value;const pos=el.selectionStart;render();const n=$('#d-q');n.focus();try{n.setSelectionRange(pos,pos)}catch(e){}}

document.addEventListener('change',ev=>{
  const el=ev.target;
  if(el.id==='f-scope'){ui.scope=el.value;$('#exp-list').innerHTML=expRows()}
  if(el.id==='f-cat'){ui.cat=el.value;$('#exp-list').innerHTML=expRows()}
  if(el.id==='s-remind'){S.remindDays=Number(el.value);save();render()}
  if(el.name==='theme'&&!el.closest('dialog')){S.theme=el.value;save();render()}

  if(el.name==='who'&&el.closest('#who-seg')){const p=el.value;if(p!==S.me){if(S.pins[p]){render();askPin(p,()=>enterAs(p))}else{enterAs(p);save();render()}}}
  if(el.dataset.item){const i=curList().items.find(x=>x.id===el.dataset.item);if(i){i.done=el.checked;save();render()}}
  if(el.id==='s-na'||el.id==='s-nb'){const v=el.value.trim();if(v){S.names[el.id==='s-na'?'a':'b']=v;save();render()}}
});
